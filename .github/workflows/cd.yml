name: Docker Image

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - pyproject.toml
      - "config/**"
      - "mock_api/**"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - pyproject.toml
      - "config/**"
      - "mock_api/**"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Dockerfile is not ready yet. Skipping image build."
          fi

      - name: Build image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ctf-mock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
