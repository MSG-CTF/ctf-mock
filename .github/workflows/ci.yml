name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  django-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            # Django 프로젝트 뼈대가 들어오기 전까지 CI가 깨지지 않도록 최소 도구만 설치한다.
            pip install django djangorestframework pytest pytest-django ruff
          fi

      - name: Ruff lint
        run: |
          if [ -d config ] || [ -d mock_api ] || [ -d tests ]; then
            ruff check config mock_api tests
          else
            echo "Django source directories are not ready yet. Skipping lint."
          fi

      - name: Django system check
        run: |
          if [ -f manage.py ]; then
            python manage.py check
          else
            echo "manage.py is not ready yet. Skipping Django system check."
          fi

      - name: Test
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "tests directory is not ready yet. Skipping tests."
          fi
